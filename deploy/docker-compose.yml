services:
  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.control-plane
    profiles: ["starter", "team", "enterprise"]
    ports:
      - "8000:8000"
    volumes:
      - ../runtime:/app/runtime
    environment:
      SCHEMAPILOT_PROFILE: ${SCHEMAPILOT_PROFILE:-starter}
      SCHEMAPILOT_BIND_ADDRESS: ${SCHEMAPILOT_BIND_ADDRESS:-0.0.0.0}
      SCHEMAPILOT_AUTH_MODE: ${SCHEMAPILOT_AUTH_MODE:-local}
      SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL: ${SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL:-true}
      SCHEMAPILOT_OIDC_CLAIMS_HEADER: ${SCHEMAPILOT_OIDC_CLAIMS_HEADER:-x-schemapilot-oidc-claims}
      SCHEMAPILOT_OIDC_ACTOR_ID_CLAIM: ${SCHEMAPILOT_OIDC_ACTOR_ID_CLAIM:-sub}
      SCHEMAPILOT_OIDC_ROLES_CLAIM: ${SCHEMAPILOT_OIDC_ROLES_CLAIM:-roles}
      SCHEMAPILOT_OIDC_ATTRIBUTES_CLAIM: ${SCHEMAPILOT_OIDC_ATTRIBUTES_CLAIM:-attributes}
      SCHEMAPILOT_OIDC_REQUIRED_ISSUER: ${SCHEMAPILOT_OIDC_REQUIRED_ISSUER:-}
      SCHEMAPILOT_OIDC_REQUIRED_AUDIENCE: ${SCHEMAPILOT_OIDC_REQUIRED_AUDIENCE:-}
      SCHEMAPILOT_QUERY_ENGINE: ${SCHEMAPILOT_QUERY_ENGINE:-duckdb}
      SCHEMAPILOT_TRINO_URL: ${SCHEMAPILOT_TRINO_URL:-http://trino:8080}
      SCHEMAPILOT_TRINO_USER: ${SCHEMAPILOT_TRINO_USER:-schemapilot}
      SCHEMAPILOT_TRINO_CATALOG: ${SCHEMAPILOT_TRINO_CATALOG:-memory}
      SCHEMAPILOT_TRINO_SCHEMA: ${SCHEMAPILOT_TRINO_SCHEMA:-default}

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    profiles: ["starter", "team", "enterprise"]
    ports:
      - "8001:8001"
    volumes:
      - ../runtime:/app/runtime
    environment:
      SCHEMAPILOT_PROFILE: ${SCHEMAPILOT_PROFILE:-starter}
      SCHEMAPILOT_BIND_ADDRESS: ${SCHEMAPILOT_BIND_ADDRESS:-0.0.0.0}
      SCHEMAPILOT_AUTH_MODE: ${SCHEMAPILOT_AUTH_MODE:-local}
      SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL: ${SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL:-true}
      SCHEMAPILOT_OIDC_CLAIMS_HEADER: ${SCHEMAPILOT_OIDC_CLAIMS_HEADER:-x-schemapilot-oidc-claims}
      SCHEMAPILOT_OIDC_ACTOR_ID_CLAIM: ${SCHEMAPILOT_OIDC_ACTOR_ID_CLAIM:-sub}
      SCHEMAPILOT_OIDC_ROLES_CLAIM: ${SCHEMAPILOT_OIDC_ROLES_CLAIM:-roles}
      SCHEMAPILOT_OIDC_ATTRIBUTES_CLAIM: ${SCHEMAPILOT_OIDC_ATTRIBUTES_CLAIM:-attributes}
      SCHEMAPILOT_OIDC_REQUIRED_ISSUER: ${SCHEMAPILOT_OIDC_REQUIRED_ISSUER:-}
      SCHEMAPILOT_OIDC_REQUIRED_AUDIENCE: ${SCHEMAPILOT_OIDC_REQUIRED_AUDIENCE:-}
      SCHEMAPILOT_RETRIEVAL_BACKEND: ${SCHEMAPILOT_RETRIEVAL_BACKEND:-filesystem}
      SCHEMAPILOT_OPENSEARCH_ENABLED: ${SCHEMAPILOT_OPENSEARCH_ENABLED:-false}
      SCHEMAPILOT_OPENSEARCH_URL: ${SCHEMAPILOT_OPENSEARCH_URL:-http://opensearch:9200}
      SCHEMAPILOT_OPENSEARCH_INDEX: ${SCHEMAPILOT_OPENSEARCH_INDEX:-schemapilot_docs}
      SCHEMAPILOT_OPENSEARCH_TIMEOUT_MS: ${SCHEMAPILOT_OPENSEARCH_TIMEOUT_MS:-3000}
      SCHEMAPILOT_QDRANT_ENABLED: ${SCHEMAPILOT_QDRANT_ENABLED:-false}
      SCHEMAPILOT_QDRANT_URL: ${SCHEMAPILOT_QDRANT_URL:-http://qdrant:6333}
      SCHEMAPILOT_QDRANT_COLLECTION: ${SCHEMAPILOT_QDRANT_COLLECTION:-schemapilot_docs}
      SCHEMAPILOT_QDRANT_TIMEOUT_MS: ${SCHEMAPILOT_QDRANT_TIMEOUT_MS:-3000}
      SCHEMAPILOT_EMBEDDINGS_PROVIDER: ${SCHEMAPILOT_EMBEDDINGS_PROVIDER:-disabled}
      SCHEMAPILOT_EMBEDDINGS_DIMENSIONS: ${SCHEMAPILOT_EMBEDDINGS_DIMENSIONS:-16}
    depends_on:
      - control-plane

  ai-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai-service
    profiles: ["ai", "enterprise"]
    ports:
      - "8002:8002"
    volumes:
      - ../runtime:/app/runtime
    environment:
      SCHEMAPILOT_PROFILE: ${SCHEMAPILOT_PROFILE:-starter}
      SCHEMAPILOT_BIND_ADDRESS: ${SCHEMAPILOT_BIND_ADDRESS:-0.0.0.0}
      SCHEMAPILOT_AUTH_MODE: ${SCHEMAPILOT_AUTH_MODE:-local}
      SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL: ${SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL:-true}
      SCHEMAPILOT_AI_SERVICE_ENABLED: ${SCHEMAPILOT_AI_SERVICE_ENABLED:-false}
      SCHEMAPILOT_AI_PROVIDER: ${SCHEMAPILOT_AI_PROVIDER:-disabled}
      SCHEMAPILOT_AI_GATEWAY_URL: ${SCHEMAPILOT_AI_GATEWAY_URL:-http://gateway:8001}
      SCHEMAPILOT_AI_CONTROL_PLANE_URL: ${SCHEMAPILOT_AI_CONTROL_PLANE_URL:-http://control-plane:8000}
    depends_on:
      - control-plane
      - gateway

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    profiles: ["starter", "team", "enterprise"]
    volumes:
      - ../runtime:/app/runtime
    environment:
      SCHEMAPILOT_PROFILE: ${SCHEMAPILOT_PROFILE:-starter}
      SCHEMAPILOT_STORAGE_ROOT: ${SCHEMAPILOT_STORAGE_ROOT:-./runtime/storage}
      SCHEMAPILOT_DATABASE_URL: ${SCHEMAPILOT_DATABASE_URL:-sqlite:///./runtime/schemapilot.db}
      SCHEMAPILOT_WORKER_POLL_SECONDS: ${SCHEMAPILOT_WORKER_POLL_SECONDS:-2}
      SCHEMAPILOT_WORKER_MAX_RUNS_PER_TICK: ${SCHEMAPILOT_WORKER_MAX_RUNS_PER_TICK:-1}
      SCHEMAPILOT_OPENSEARCH_ENABLED: ${SCHEMAPILOT_OPENSEARCH_ENABLED:-false}
      SCHEMAPILOT_OPENSEARCH_URL: ${SCHEMAPILOT_OPENSEARCH_URL:-http://opensearch:9200}
      SCHEMAPILOT_OPENSEARCH_INDEX: ${SCHEMAPILOT_OPENSEARCH_INDEX:-schemapilot_docs}
      SCHEMAPILOT_OPENSEARCH_TIMEOUT_MS: ${SCHEMAPILOT_OPENSEARCH_TIMEOUT_MS:-3000}
      SCHEMAPILOT_QDRANT_ENABLED: ${SCHEMAPILOT_QDRANT_ENABLED:-false}
      SCHEMAPILOT_QDRANT_URL: ${SCHEMAPILOT_QDRANT_URL:-http://qdrant:6333}
      SCHEMAPILOT_QDRANT_COLLECTION: ${SCHEMAPILOT_QDRANT_COLLECTION:-schemapilot_docs}
      SCHEMAPILOT_QDRANT_TIMEOUT_MS: ${SCHEMAPILOT_QDRANT_TIMEOUT_MS:-3000}
      SCHEMAPILOT_EMBEDDINGS_PROVIDER: ${SCHEMAPILOT_EMBEDDINGS_PROVIDER:-disabled}
      SCHEMAPILOT_EMBEDDINGS_DIMENSIONS: ${SCHEMAPILOT_EMBEDDINGS_DIMENSIONS:-16}
    depends_on:
      - control-plane
      - postgres

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    profiles: ["starter", "team", "enterprise"]
    ports:
      - "5173:5173"
    environment:
      VITE_CONTROL_PLANE_URL: http://control-plane:8000
      VITE_GATEWAY_URL: http://gateway:8001
    depends_on:
      - control-plane
      - gateway

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: ["team", "enterprise"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"

  postgres:
    image: postgres:16.6
    profiles: ["team", "enterprise"]
    environment:
      POSTGRES_DB: schemapilot
      POSTGRES_USER: schemapilot
      POSTGRES_PASSWORD: schemapilot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trino:
    image: trinodb/trino:459
    profiles: ["team", "enterprise"]
    command: ["trino"]

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: ["docs_search", "enterprise"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["docs_vector", "enterprise"]

  opa:
    image: openpolicyagent/opa:1.3.0-static
    profiles: ["enterprise"]
    command: ["run", "--server", "--addr=0.0.0.0:8181"]
    ports:
      - "8181:8181"

volumes:
  postgres_data:
