apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemapilot-gateway
  namespace: schemapilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schemapilot-gateway
  template:
    metadata:
      labels:
        app: schemapilot-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/example/schemapilot-gateway:latest
          envFrom:
            - secretRef:
                name: schemapilot-secrets
          env:
            - name: SCHEMAPILOT_BIND_ADDRESS
              value: "0.0.0.0"
            - name: SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL
              value: "true"
            - name: SCHEMAPILOT_PROFILE
              value: "team"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
