apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemapilot-default-deny-ingress
  namespace: schemapilot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemapilot-allow-ui-to-api
  namespace: schemapilot
spec:
  podSelector:
    matchLabels:
      app: schemapilot-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemapilot-ui
        - podSelector:
            matchLabels:
              app: schemapilot-ai-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemapilot-allow-ui-to-gateway
  namespace: schemapilot
spec:
  podSelector:
    matchLabels:
      app: schemapilot-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemapilot-ui
        - podSelector:
            matchLabels:
              app: schemapilot-ai-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemapilot-allow-worker-to-control-plane
  namespace: schemapilot
spec:
  podSelector:
    matchLabels:
      app: schemapilot-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemapilot-worker
