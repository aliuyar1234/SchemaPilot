apiVersion: v1
kind: Secret
metadata:
  name: schemapilot-secrets
  namespace: schemapilot
type: Opaque
stringData:
  SCHEMAPILOT_DATABASE_URL: "sqlite:///./runtime/schemapilot.db"
  SCHEMAPILOT_STORAGE_ROOT: "./runtime/storage"
  SCHEMAPILOT_AUTH_MODE: "local"
  SCHEMAPILOT_OIDC_REQUIRED_ISSUER: ""
  SCHEMAPILOT_OIDC_REQUIRED_AUDIENCE: ""
  SCHEMAPILOT_SECRETS_STORE_BACKEND: "local_encrypted"
  SCHEMAPILOT_SECRETS_MASTER_KEY: "change-me"
