apiVersion: apps/v1
kind: Deployment
metadata:
  name: schemapilot-ui
  namespace: schemapilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schemapilot-ui
  template:
    metadata:
      labels:
        app: schemapilot-ui
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/example/schemapilot-ui:latest
          env:
            - name: VITE_CONTROL_PLANE_URL
              value: "http://schemapilot-control-plane:8000"
            - name: VITE_GATEWAY_URL
              value: "http://schemapilot-gateway:8001"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5173
