apiVersion: v1
kind: Service
metadata:
  name: schemapilot-control-plane
  namespace: schemapilot
spec:
  selector:
    app: schemapilot-control-plane
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: schemapilot-gateway
  namespace: schemapilot
spec:
  selector:
    app: schemapilot-gateway
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: schemapilot-ui
  namespace: schemapilot
spec:
  selector:
    app: schemapilot-ui
  ports:
    - port: 5173
      targetPort: 5173
