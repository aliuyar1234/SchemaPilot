apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Values.namespace }}
  labels:
{{ include "schemapilot.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: schemapilot-control-plane
  template:
    metadata:
      labels:
        app: schemapilot-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: {{ .Values.controlPlane.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: SCHEMAPILOT_PROFILE
              value: {{ .Values.env.profile | quote }}
            - name: SCHEMAPILOT_BIND_ADDRESS
              value: {{ .Values.env.bindAddress | quote }}
            - name: SCHEMAPILOT_REQUIRE_AUTH_FOR_NON_LOCAL
              value: {{ .Values.env.requireAuthForNonLocal | quote }}
          ports:
            - containerPort: {{ .Values.service.controlPlanePort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
