{{- if .Values.aiService.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai-service
  namespace: {{ .Values.namespace }}
  labels:
{{ include "schemapilot.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.aiService.replicas }}
  selector:
    matchLabels:
      app: schemapilot-ai-service
  template:
    metadata:
      labels:
        app: schemapilot-ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: {{ .Values.aiService.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: SCHEMAPILOT_AI_SERVICE_ENABLED
              value: "true"
            - name: SCHEMAPILOT_AI_GATEWAY_URL
              value: "http://{{ .Release.Name }}-gateway:{{ .Values.service.gatewayPort }}"
            - name: SCHEMAPILOT_AI_CONTROL_PLANE_URL
              value: "http://{{ .Release.Name }}-control-plane:{{ .Values.service.controlPlanePort }}"
          ports:
            - containerPort: {{ .Values.service.aiServicePort }}
