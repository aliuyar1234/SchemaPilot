apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ui-to-control-plane
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: schemapilot-control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemapilot-ui
        - podSelector:
            matchLabels:
              app: schemapilot-worker
{{- if .Values.aiService.enabled }}
        - podSelector:
            matchLabels:
              app: schemapilot-ai-service
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ui-to-gateway
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: schemapilot-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: schemapilot-ui
{{- if .Values.aiService.enabled }}
        - podSelector:
            matchLabels:
              app: schemapilot-ai-service
{{- end }}
